services:
  - type: web
    name: mortalidad-colombia-2019
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:server -b 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
